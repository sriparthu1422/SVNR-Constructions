ic form handlers, context-based authentication.\n* **Backend**: Node.js, Express, MongoDB (Mongoose), JWT Auth, CORS, Helmet.\n* **Integrations**: WhatsApp click-to-chat API, Render (Backend API), Vercel/Netlify (Frontend & Admin).\n\nThis process demonstrates a solid mix of UI design, database modeling, cloud configuration, security awareness, and rigorous performance optimization. Please let me know what we should work on next!"},{"sender":"User","timestamp":"2026-05-31T18:36:05Z","content":"I would like to know whether REST APIs were used in this project or not."},{"sender":"Antigravity Assistant (AI)","timestamp":"2026-05-31T18:36:13Z","content":"**Yes, REST APIs are used in this project.** \n\nIn fact, the entire communication between your frontend/admin dashboards and the Node.js/Express server is designed around classic, textbook **REST (Representational State Transfer)** API patterns.\n\nHere is how your codebase implements REST API conventions:\n\n### 1. Resource-Oriented Routing\nIn REST, APIs are organized around \"resources\" (nouns in the URL path). Your backend (`backend/index.js`) maps distinct routes for each resource under the `/api` prefix:\n* `/api/projects` (Projects resource)\n* `/api/bookings` (Bookings resource)\n* `/api/inquiries` (Inquiries resource)\n* `/api/testimonials` (Testimonials resource)\n* `/api/founders` (Founders resource)\n* `/api/stats` (Statistics resource)\n\n### 2. Standard HTTP Methods (Verbs)\nYour routes map traditional HTTP action verbs to standard database Operations (CRUD):\n\nTake a look at your projects router (`backend/routes/projects.js`):\n* **`GET /api/projects`** — Retrieves a collection of projects (**Read**)\n* **`GET /api/projects/:id`** — Retrieves a specific project by its unique ID (**Read**)\n* **`POST /api/projects`** — Creates a new project (**Create**)\n* **`PUT /api/projects/:id`** — Updates a specific project by its ID (**Update**)\n* **`DELETE /api/projects/:id`** — Deletes a specific project (**Delete**)\n\n### 3. Proper HTTP Status Codes\nYour REST API communicates outcomes to the client using standardized, semantic HTTP status codes:\n* **`200 OK`**: Returned for successful data retrievals and updates.\n* **`201 Created`**: Returned specifically when a resource is successfully created (e.g., in `POST /api/projects` when a project is saved).\n* **`404 Not Found`**: Returned if a client requests an ID that doesn't exist.\n* **`500 Internal Server Error`**: Standard error catch-all.\n\n### 4. JSON-Based Communication (Statelessness)\n* Your endpoints accept requests with JSON payloads (handled by the `express.json()` middleware in `backend/index.js`).\n* They respond exclusively with structured JSON responses (`res.json()`), adhering to modern REST API standards."},{"sender":"User","timestamp":"2026-05-31T18:38:13Z","content":"I would like to know all the tools and technologies that were used in this project, including the frontend, backend, database, APIs, deployment, and any AI tools involved."},{"sender":"Antigravity Assistant (AI)","timestamp":"2026-05-31T18:38:18Z","content":"This project leverages a highly optimized, modern, and production-grade software stack. Here is the complete breakdown of all the tools, libraries, technologies, and deployment strategies used across the entire ecosystem:\n\n---\n\n### 1. Frontend Technologies (Main Website)\nThe public-facing portal is designed for high performance, smooth animations, and search visibility.\n* **Core Framework**: **React (v19)** — Building modular, reusable UI components.\n* **Build System & Dev Server**: **Vite (v7)** — High-performance bundling and instant Hot Module Replacement (HMR).\n* **Styling**: **Tailwind CSS (v4)** — Utilized for rich responsive layout components and dynamic theme tokens.\n* **Routing**: **React Router DOM (v7)** — Client-side SPA routing.\n* **Animations**: **Framer Motion (v12)** — Powering advanced top-to-bottom scroll animations and smooth transition reveals.\n* **Smooth Scrolling**: **Lenis** — Implements premium, high-frequency, physics-based inertial scrolling.\n* **Icons**: **Lucide React** — Crisp, SVG-based responsive iconography.\n* **Interactive VR Elements**: **Pannellum** — A lightweight, open-source 360-degree panorama viewer used in the **Explore VR** module to allow virtual walkthroughs of properties.\n* **Analytics**: **React GA4** — Modern Google Analytics 4 integration for tracking user actions.\n* **Image Processing**: **Sharp** — Server-side/build-time asset compression used to compress heavy image files and convert them into `.webp` format for faster loads.\n\n---\n\n### 2. Admin Dashboard Technologies\nA dedicated, secure platform designed for administrative oversight of leads, projects, testimonials, and stats.\n* **Framework & Build**: **React (v19)** & **Vite (v7)**.\n* **State & Authentication**: React Context API (`AuthContext.jsx`) managing persistent JSON Web Token (JWT) states.\n* **Security Constraints**: Built-in automated idle token expiry detection to trigger safe session logouts.\n* **Bundling Stabilization**: Hard-pinned configuration for **Rollup** (v4.57.1) specifica\n\u003ctruncated 546 bytes>\ncation for all admin-restricted endpoints.\n* **File Upload Management**: **Multer** — Middleware for handling multipart/form-data, uploading project and founder images to the server directory.\n* **Middleware Utilities**:\n  * **CORS**: Configured with strict preflight checking, explicitly sorted before Helmet to enable clean web form interactions.\n  * **Morgan**: HTTP request logging for active backend debugging.\n  * **Dotenv**: Environment variable isolation.\n\n---\n\n### 4. Database\n* **Database Engine**: **MongoDB** — A NoSQL document store ideal for managing dynamic property listings with varying metadata (e.g., coordinates, different image dimensions).\n* **Database Driver / ODM**: **Mongoose (v8)** — Schema definition, strict type casting, and validation logic.\n\n---\n\n### 5. Integrations
